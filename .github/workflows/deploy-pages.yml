name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Solo un despliegue a la vez; no cancelar uno en curso.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # El build compila functions/ a dist/_worker.js/ para Cloudflare Workers.
      # GitHub Pages es estático y no lo ejecuta: si se subiera, solo serviría
      # para publicar el código de servidor como archivo descargable.
      - name: Quitar el worker de Cloudflare del artefacto
        run: rm -rf dist/_worker.js dist/.assetsignore

      - name: SPA fallback (deep links / refresh no dan 404)
        run: cp dist/index.html dist/404.html

      - name: Custom domain
        run: echo 'www.datuva.es' > dist/CNAME

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
